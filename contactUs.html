<!DOCTYPE html>

  <meta charset="UTF-8">

  <link rel="icon" href="Assets/riddlio web icon.png" type="image/png">
  
  <link rel="stylesheet" href="./css/contact.css">

</head>
<body>

      <!-- Sidebar -->
  <div id="sidebar" class="sidebar">
    <button id="closeSidebar" class="close-btn">X</button>

      <li><a href="index.html">Home</a></li>

  <!-- Main Content -->
  <div id="main-content">
    <!-- Sidebar toggle button -->
    <button id="openSidebar" class="open-btn">☰</button>


  <div class="contact-container">
    <h1>Contact Us</h1>
    <p>Got questions, ideas, or feedback? We'd love to hear from you!</p>

    <form action="https://formsubmit.co/official.riddlio@gmail.com" method="POST" id="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      
      <button type="submit">Send Message</button>

    </form>

    <div class="social-buttons-container">
        <div class="social-buttons">
          <a href="https://www.instagram.com/riddlio" target="_blank" class="social-button instagram">Instagram</a>
          <a href="https://www.tiktok.com/@official_riddlio" target="_blank" class="social-button tiktok">TikTok</a>
        </div>
  </div>

      <!-- JS for Sidebar -->
      <script src="./js/sidebar.js"></script>

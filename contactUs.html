<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <link rel="stylesheet" href="./css/contact.css">
</head>
<body>

  <div class="contact-container">
    <h1>Contact Us</h1>
    <p>Got questions, ideas, or feedback? We'd love to hear from you!</p>

    <form action="https://formsubmit.co/official.riddlio@gmail.com" method="POST" id="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <!-- Optional hidden fields -->
      <input type="hidden" name="_subject" value="New message from your website!">
      <input type="hidden" name="_next" value="https://yourwebsite.com/thankyou.html">

      <button type="submit">Send Message</button>

      <div class="success-message" id="success-message">Thank you! Your message has been sent. 🎉</div>
    </form>
  </div>

  <!-- You can remove this JavaScript if you're not doing anything fancy -->
  <script src="./js/contact.js"></script>
</body>
</html>
